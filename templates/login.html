<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Family Scrapbook</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=25">
</head>
<body class="subpage-body">
    <header class="auth-nav">
        <button id="lang-toggle" class="lang-btn">한국어 / English</button>
    </header>

    <div class="subpage-container" style="max-width: 400px; text-align: center; margin-top: 80px;">
        <h1 class="pane-title" data-kr="로그인" data-en="Login">Login</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p style="color: red; margin-bottom: 15px;">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" name="username" placeholder="Username" required class="paper-input">
            <input type="password" name="password" placeholder="Password" required class="paper-input">
            <button type="submit" class="stamp-btn" data-kr="로그인" data-en="LOGIN">LOGIN</button>
        </form>
        <p style="margin-top: 20px;"><a href="/register" style="color: #222;" data-kr="계정이 없으신가요? 여기서 가입하세요" data-en="Don't have an account? Register here">Don't have an account? Register here</a></p>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
